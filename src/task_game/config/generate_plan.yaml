  # 该段路线的最大平移速度
  max_velocity: 1.2
  # 该段路线的最大平移加速度
  max_accelation: 0.5
  # 该段路线的最大角速度
  max_omega: 0.8
  # 闭环控制比例参数 [x, y, yaw]
  kp: [2.0, 2.0, 2.0]
  # 起步时允许的朝向误差
  allow_start_dir_error: 0.1
  # 最终允许的朝向误差
  allow_final_dir_error: 0.1
  # 最终允许的位置误差
  allow_final_pos_allow: 0.05
  # 微调时的最小平移速度
  adjust_min_vel: 0.35
  # 微调时的最小角速度
  adjust_min_omega: 0.35
  # 是否允许较大的 y 向速度
  allow_y_vel: false
  # 轨迹衔接半径，0 表示不用曲线连接
  trajectory_connection_radius: 0.0

a2_to_a3_target_point: &a2_to_a3_target_point
