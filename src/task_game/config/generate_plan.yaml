# task_game 搬箱规划配置
#
# 这份配置主要包含三部分：
# 1. box_positions：场地里的放置区/抓取区固定点位（每个点格式为 [x, y, yaw]）
# 2. routes：根据道路 A/C/E 进入抓取区前的两个过渡点 a1/a2
# 3. target_points：6 类固定路段的运动控制参数
#
# 轨迹段对应关系：
# - start_to_a1：起始点 -> a1（仅第一条计划使用）
# - a1_to_a2：a1 -> a2（仅第一条计划使用）
# - a2_to_src：a2 -> src（仅第一条计划使用）
# - src_to_dst：src -> dst（每一条计划都会使用）
# - dst_to_dst2：dst -> dst2（从第二条计划开始使用，先从放置区后退离开）
# - dst2_to_src：dst2 -> 下一次 src（从第二条计划开始使用）

start_to_a1_target_point: &start_to_a1_target_point
  # 是否要求机器人到点后朝向 target_yaw
  constraint_target_yaw: true
  # 到达目标点后的期望速度
  target_vel: 0.4
  # 该段路线的最大平移速度
  max_velocity: 0.5
  # 该段路线的最大平移加速度
  max_accelation: 0.15
  # 该段路线的最大角速度
  max_omega: 1.35
  # 闭环控制比例参数 [x, y, yaw]
  kp: [2.5, 2.0, 2.5]
  # 起步时允许的朝向误差
  allow_start_dir_error: 0.1
  # 最终允许的朝向误差
  allow_final_dir_error: 0.1
  # 最终允许的位置误差
  allow_final_pos_allow: 0.1
  # 微调时的最小平移速度
  adjust_min_vel: 0.35
  # 微调时的最小角速度
  adjust_min_omega: 0.3
  # 是否允许较大的 y 向速度
  allow_y_vel: true
  # 轨迹衔接半径，0 表示不用曲线连接
  trajectory_connection_radius: 0.0

a1_to_a2_target_point: &a1_to_a2_target_point
  # 是否要求机器人到点后朝向 target_yaw
  constraint_target_yaw: true
  # 到达目标点后的期望速度
  target_vel: 0.6
  # 该段路线的最大平移速度
  max_velocity: 1.0
  # 该段路线的最大平移加速度
  max_accelation: 1.0
  # 该段路线的最大角速度
  max_omega: 1.5
  # 闭环控制比例参数 [x, y, yaw]
  kp: [2.5, 2.0, 2.5]
  # 起步时允许的朝向误差
  allow_start_dir_error: 0.1
  # 最终允许的朝向误差
  allow_final_dir_error: 0.3
  # 最终允许的位置误差
  allow_final_pos_allow: 0.1
  # 微调时的最小平移速度
  adjust_min_vel: 0.35
  # 微调时的最小角速度
  adjust_min_omega: 0.3
  # 是否允许较大的 y 向速度
  allow_y_vel: false
  # 轨迹衔接半径，0 表示不用曲线连接
  trajectory_connection_radius: 0.0

a2_to_src_target_point: &a2_to_src_target_point
  # 是否要求机器人到点后朝向 target_yaw
  constraint_target_yaw: true
  # 到达目标点后的期望速度
  target_vel: 0.0
  # 该段路线的最大平移速度
  max_velocity: 1.0
  # 该段路线的最大平移加速度
  max_accelation: 0.4
  # 该段路线的最大角速度
  max_omega: 1.0
  # 闭环控制比例参数 [x, y, yaw]
  kp: [2.5, 2.0, 2.50]
  # 起步时允许的朝向误差
  allow_start_dir_error: 0.1
  # 最终允许的朝向误差
  allow_final_dir_error: 0.2
  # 最终允许的位置误差
  allow_final_pos_allow: 0.1
  # 微调时的最小平移速度
  adjust_min_vel: 0.35
  # 微调时的最小角速度
  adjust_min_omega: 0.3
  # 是否允许较大的 y 向速度
  allow_y_vel: true
  # 轨迹衔接半径，0 表示不用曲线连接
  trajectory_connection_radius: 0.0

src_to_dst_target_point: &src_to_dst_target_point
  # 是否要求机器人到点后朝向 target_yaw
  constraint_target_yaw: true
  # 到达目标点后的期望速度
  target_vel: 0.0
  # 该段路线的最大平移速度
  max_velocity: 1.0
  # 该段路线的最大平移加速度
  max_accelation: 1.0
  # 该段路线的最大角速度
  max_omega: 1.5
  # 闭环控制比例参数 [x, y, yaw]
  kp: [2.5, 2.0, 2.5]
  # 起步时允许的朝向误差
  allow_start_dir_error: 0.1
  # 最终允许的朝向误差
  allow_final_dir_error: 0.2
  # 最终允许的位置误差
  allow_final_pos_allow: 0.1
  # 微调时的最小平移速度
  adjust_min_vel: 0.35
  # 微调时的最小角速度
  adjust_min_omega: 0.3
  # 是否允许较大的 y 向速度
  allow_y_vel: false
  # 轨迹衔接半径，0 表示不用曲线连接
  trajectory_connection_radius: 0.0

dst_to_dst2_target_point: &dst_to_dst2_target_point
  # 是否要求机器人到点后朝向 target_yaw
  constraint_target_yaw: false
  # 到达目标点后的期望速度
  target_vel: 0.4
  # 该段路线的最大平移速度
  max_velocity: 1.0
  # 该段路线的最大平移加速度
  max_accelation: 0.2
  # 该段路线的最大角速度
  max_omega: 1.5
  # 闭环控制比例参数 [x, y, yaw]
  kp: [2.5, 2.0, 2.5]
  # 起步时允许较大的朝向误差，便于直接倒车离开放置区
  allow_start_dir_error: 3.2
  # 最终允许的朝向误差
  allow_final_dir_error: 0.15
  # 最终允许的位置误差
  allow_final_pos_allow: 0.1
  # 微调时的最小平移速度
  adjust_min_vel: 0.35
  # 微调时的最小角速度
  adjust_min_omega: 0.3
  # 是否允许较大的 y 向速度
  allow_y_vel: true
  # 轨迹衔接半径，0 表示不用曲线连接
  trajectory_connection_radius: 0.0

dst2_to_src_target_point: &dst2_to_src_target_point
  # 是否要求机器人到点后朝向 target_yaw
  constraint_target_yaw: true
  # 到达目标点后的期望速度
  target_vel: 0.0
  # 该段路线的最大平移速度
  max_velocity: 1.0
  # 该段路线的最大平移加速度
  max_accelation: 1.0
  # 该段路线的最大角速度
  max_omega: 1.5
  # 闭环控制比例参数 [x, y, yaw]
  kp: [2.5, 2.0, 2.5]
  # 起步时允许的朝向误差
  allow_start_dir_error: 0.1
  # 最终允许的朝向误差
  allow_final_dir_error: 0.1
  # 最终允许的位置误差
  allow_final_pos_allow: 0.1
  # 微调时的最小平移速度
  adjust_min_vel: 0.35
  # 微调时的最小角速度
  adjust_min_omega: 0.3
  # 是否允许较大的 y 向速度
  allow_y_vel: false
  # 轨迹衔接半径，0 表示不用曲线连接
  trajectory_connection_radius: 0.25

box_positions:
  # 放置区 4 个槽位，索引按 box_id 对应，格式为 [x, y, yaw]
  place:
    - [4.495, -0.725, 0.0] # box_id 0
    - [4.495, -1.575, 0.0] # box_id 1
    - [4.495, -2.425, 0.0] # box_id 2
    - [4.495, -3.275, 0.0] # box_id 3
  # 抓取区第一排 4 个槽位，格式为 [x, y, yaw]
  pick_row_0:
    - [3.05, -0.725, 3.1415926] # col 0
    - [3.05, -1.575, 3.1415926] # col 1
    - [3.05, -2.425, 3.1415926] # col 2
    - [3.05, -3.275, 3.1415926] # col 3
  # 抓取区第二排 4 个槽位，格式为 [x, y, yaw]
  pick_row_1:
    - [2.005, -0.725, 3.1415926] # col 0
    - [2.005, -1.575, 3.1415926] # col 1
    - [2.005, -2.425, 3.1415926] # col 2
    - [2.005, -3.275, 3.1415926] # col 3
#-0.43-0.125
routes:
  # 根据 VIP 所在边列选择进入路线：
  # - A：默认路线
  # - C：左右边都有 VIP 时走中间路线
  # - E：仅左边有 VIP 时走上方路线
  # 每条路线包含两个过渡点：a1、a2，格式为 [x, y, yaw]
  A:
    a1: [0.795, -0.3, 0.0]
    a2: [3.05, -0.3, 3.1415926]
  C:
    a1: [0.795, -2.0, 0.0]
    a2: [3.05, -2.0, 3.1415926]
  E:
    a1: [0.795, -3.7, 0.0]
    a2: [3.05, -3.7, 3.1415926]


target_points:
  # 第一条计划：起始点 -> a1
  start_to_a1: *start_to_a1_target_point

  # 第一条计划：a1 -> a2
  a1_to_a2: *a1_to_a2_target_point

  # 第一条计划：a2 -> src（到抓取点）
  a2_to_src: *a2_to_src_target_point

  # 每条计划：src -> dst（抓取点到放置点）
  src_to_dst: *src_to_dst_target_point

  # 从第二条计划开始：上一次 dst -> dst2（先后退离开放置区）
  dst_to_dst2: *dst_to_dst2_target_point

  # 从第二条计划开始：dst2 -> 下一次 src
  dst2_to_src: *dst2_to_src_target_point
