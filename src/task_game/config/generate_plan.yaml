box_positions:
  # 放置区 4 个槽位，索引按 box_id 对应，格式为 [x, y, yaw]
  place:
    - [4.61, 1.10, 0.0] # box_id 0
    - [4.63, 0.29, 0.0] # box_id 1
    - [4.63, -0.52, 0.0] # box_id 2
    - [4.60, -1.26, 0.0] # box_id 3
  # 抓取区第一排 4 个槽位，格式为 [x, y, yaw]
  pick_row_0:
    - [2.94, 1.32, 3.1415926] # col 0
    - [2.92, 0.45, 3.1415926] # col 1
    - [2.95, -0.34, 3.1415926] # col 2
    - [2.94, -1.20, 3.1415926] # col 3
  # 抓取区第二排 4 个槽位，格式为 [x, y, yaw]
  pick_row_1:
    - [2.07, 1.31, 3.1415926] # col 0
    - [2.07, 0.48, 3.1415926] # col 1
    - [2.10, -0.39, 3.1415926] # col 2
    - [2.13, -1.20, 3.1415926] # col 3

routes:
  # 根据 VIP 所在边列选择进入路线：
  # - A：默认路线
  # - C：左右边都有 VIP 时走中间路线
  # - E：仅左边有 VIP 时走上方路线
  # 每条路线包含两个过渡点：a1、a2，格式为 [x, y, yaw]
  A:
    a1: [0.69, 1.60, 0.0]
    a2: [3.91, 1.65, 0.0]
  C:
    a1: [0.75, -0.05, 0.0]
    a2: [3.78, 0.02, 0.0]
  E:
    a1: [0.67, -1.66, 0.0]
    a2: [3.84, -1.76, 0.0]

target_points:
  # 第一条计划：起始点 -> a1
  start_to_a1: *start_to_a1_target_point

  # 第一条计划：a1 -> a2
  a1_to_a2: *a1_to_a2_target_point

  # 第一条计划：a2 -> src（到抓取点）
  a2_to_src: *a2_to_src_target_point

  # 每条计划：src -> dst（抓取点到放置点）
  src_to_dst: *src_to_dst_target_point

  # 从第二条计划开始：上一次 dst -> 下一次 src
  dst_to_src: *dst_to_src_target_point
