routes:
  # 根据 VIP 所在边列选择进入路线：
  # - A：默认路线
  # - C：左右边都有 VIP 时走中间路线
  # - E：仅左边有 VIP 时走上方路线
  # 每条路线包含两个固定过渡点：a1、a2，格式为 [x, y, yaw]
  # A:
  #   a1: [0.895, -0.25, 0.0]
  #   a2: [3.20, -0.25, 3.1415926]
  # C:
  #   a1: [0.895, -2.0, 0.0]
  #   a2: [3.20, -2.0, 3.1415926]
  # E:
  #   a1: [0.895, -3.7, 0.0]
  #   a2: [3.20, -3.7, 3.1415926]
  A:
    a1: [0.895, -2.0, 0.0]
    a2: [3.20, -2.0, 3.1415926]
  C:
    a1: [0.895, -2.0, 0.0]
    a2: [3.20, -2.0, 3.1415926]
  E:
    a1: [0.895, -2.0, 0.0]
    a2: [3.20, -2.0, 3.1415926]


target_points:
  # 第一条计划：起始点 -> a1
  start_to_a1: *start_to_a1_target_point

  # 第一条计划：a1 -> a2
  a1_to_a2: *a1_to_a2_target_point

  # 第一条计划：a2 -> a3（a3 为动态点，x 取 a2，y 取 src）
  a2_to_a3: *a2_to_a3_target_point

  # 第一条计划：a3 -> src（到抓取点）
  a3_to_src: *a3_to_src_target_point

  # 每条计划：src -> dst（抓取点到放置点）
  src_to_dst: *src_to_dst_target_point

  # 从第二条计划开始：上一次 dst -> dst2（先后退离开放置区）
  dst_to_dst2: *dst_to_dst2_target_point

  # 从第二条计划开始：dst2 -> 下一次 src
  dst2_to_src: *dst2_to_src_target_point
