# task_game 单箱搬运规划配置
#
# 每轮计划搬一个箱子：ArriveToBox -> CatchBox -> ArriveToTarget -> PlaceBox。
#
# 轨迹段对应关系：
# - start_to_a0：启动区 -> C 通道过渡点 a0（仅第一轮使用）
# - a0_to_a1：a0 -> C 通道过渡点 a1（仅第一轮使用）
# - a1_to_a2：a1 -> C 通道出口 a2（仅第一轮使用）
# - a2_to_a3：a2 -> 动态 a3（a3.x 取目标 src.x，a3.y/yaw 取 a2，仅第一轮使用）
# - a3_to_src：动态 a3 -> 第一轮 src
# - src_to_dst：src -> dst 放置点
# - dst0_to_dst2：dst -> dst2 后退点位
# - dst2_to_src：dst2 -> 后续轮 src
start_to_a0_target_point: &start_to_a0_target_point
  constraint_target_yaw: true
  target_vel: 0.0
  max_velocity: 0.8
  max_accelation: 0.4
  max_omega: 1.2
  kp: [2.0, 0.5, 1.5]
  allow_start_dir_error: 0.15
  allow_final_dir_error: 0.08
  allow_final_pos_allow: 0.1
  adjust_min_vel: 0.35
  adjust_min_omega: 0.45
  allow_y_vel: true
  trajectory_connection_radius: 0.0

a0_to_a1_target_point: &a0_to_a1_target_point
  constraint_target_yaw: true
